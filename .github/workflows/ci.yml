name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prisma generate + tsc
      - run: npm run build
      # Verifica que la imagen que despliega Render compile
      - run: docker build -t canela-api:ci .
